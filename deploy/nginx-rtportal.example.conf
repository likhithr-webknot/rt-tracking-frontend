# UAT/production edge nginx for rtportal.webknot-dev.in
#
# CRITICAL: Do NOT proxy /admin, /employee, /manager, /google/callback, or /auth/callback
# to Webtrak. Only API/OAuth paths below go to the Java backend.
# Otherwise refresh on /admin/certifications shows JSON errors instead of the SPA.

upstream pulse_spa {
    server pulse-frontend:80;
}

upstream webtrak_api {
    server webtrak:8080;
}

server {
    listen 443 ssl http2;
    server_name rtportal.webknot-dev.in;

    # ssl_certificate ...;

    location /api/ {
        proxy_pass http://webtrak_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Employee profile, roster, allocations — hosted Webtrak (browser uses /__webtrak/… + service key).
    location /__webtrak/ {
        proxy_pass https://webtrak.webknot-dev.in/;
        proxy_ssl_server_name on;
        proxy_set_header Host webtrak.webknot-dev.in;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /oauth2/ {
        proxy_pass http://webtrak_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/ {
        proxy_pass http://webtrak_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Pulse SPA (React) — must handle ALL other paths including /admin/**
    location / {
        proxy_pass http://pulse_spa;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
