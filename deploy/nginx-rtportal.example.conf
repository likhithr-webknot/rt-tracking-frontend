# UAT/production edge nginx for rtportal.webknot-dev.in
#
# Only API and OAuth paths go to Webtrak. Everything else is the Pulse SPA.
# Without this, /admin/directory and similar deep links hit Spring and users see JSON errors.

upstream pulse_spa {
    server pulse-frontend:80;
}

upstream webtrak_api {
    server webtrak:8080;
}

server {
    listen 443 ssl http2;
    server_name rtportal.webknot-dev.in;

    # ssl_certificate ...;

    location /api/ {
        proxy_pass http://webtrak_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /oauth2/ {
        proxy_pass http://webtrak_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/ {
        proxy_pass http://webtrak_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://pulse_spa;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
